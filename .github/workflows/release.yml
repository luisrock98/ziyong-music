# Build downloadable packages without the upstream signing credentials.
# Publishing a GitHub Release remains a separate, manual step.
name: Build packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./internal/...
      - name: Check MyGo UI usage
        run: go tool mygo vet .

  build:
    needs: test
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, platform: "darwin/arm64,darwin/amd64" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS for Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Build packages
        run: go tool mygo build -platform "${{ matrix.platform }}"
      # Upload the packaged files, not bare .app directories whose Unix
      # permissions would be lost in the artifact service's outer ZIP.
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/**/*.dmg
            build/**/*-setup-*.exe
            build/**/*.deb
            build/**/*.tar.gz
